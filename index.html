  @media (max-width: 700px) and (orientation: portrait) {
    #title-screen {
      background: linear-gradient(0deg, #08080bfc 0%, #09090de8 31%, #09090d29 64%, #08080b94 100%);
    }
    .title-top { padding-bottom: 10px; gap: 8px; }
    .title-top .brand { font-size: 11px; gap: 7px; letter-spacing: .23em; }
    .title-top button { padding-inline: 10px; white-space: nowrap; }
    .title-content { margin-top: auto; }
    .title-content h1 { font-size: clamp(43px, 14vw, 76px); }
    .title-content .premise { margin-block: 22px 19px; }
    .title-bottom { min-height: 56px; gap: 5px 12px; }
  }
  @media (max-width: 540px) {
    .sheet { padding: 16px; }
    .sheet-head { margin-bottom: 12px; padding-bottom: 10px; }
    .sheet-actions { margin-top: 14px; }
    #cards { grid-template-columns: 1fr; gap: 8px; }
    .card {
      display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center;
      gap: 3px 9px; padding: 9px 10px; min-height: 78px;
    }
    .card-top { grid-column: 3; grid-row: 1; gap: 4px; }
    .card-rune { grid-column: 1; grid-row: 1 / 4; margin: 0; }
    .card strong { grid-column: 2; grid-row: 1; font-size: 15px; }
    .card-description, .owned { grid-column: 2 / 4; margin: 0; }
    .card-description { grid-row: 2; font-size: 12px; }
    .owned { grid-row: 3; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    @keyframes banner { 0%, 75% { opacity: 1; } 100% { opacity: 0; } }
  }
  .sheet, .map-box { border-radius: var(--r-md); background: var(--panel-grad); border-color: var(--line); }
  .sheet { box-shadow: 0 14px 45px #1a101e99, inset 0 1px #ffedf921; }
  .text-button, .primary, .skill, .bar, .bar i, #modifier-list { border-radius: var(--r-pill); }
  .text-button, .skill { background: linear-gradient(180deg, #403046ed, #251d2df4); border-color: var(--line); }
  .text-button:hover, .skill:not(:disabled):hover { border-color: var(--pink); }
  .title-content h1 { font-family: var(--sans); letter-spacing: -.03em; }
  .title-content .primary { border-color: var(--pink); color: #3e253b; background: linear-gradient(125deg, #ffe3d1, #ffc4dd); }
  .title-content .spell-picker select { border-radius: var(--r-sm); }
  .card { border-radius: var(--r-md); background: var(--panel-grad); border-top: 3px solid var(--rarity); }
  .card-rune { border-radius: 50%; background: var(--cream); color: #543a51; box-shadow: none; }
  .build-icon { border-radius: 7px; background: #2a1e2ee8; }
  #health-fill { background: linear-gradient(90deg, #e57d9f, #ffb98a); }
  #xp-fill { background: linear-gradient(90deg, #8fc7ff, #7fe0c3); }
  #hurt { box-shadow: inset 0 0 16vmin #f788b2a8; }
  #relic-bar { overflow-wrap: anywhere; }
  @media (min-width: 768px) {
    body:not(.touch-mode) .vitals { width: min(532px, 57vw); }
    body:not(.touch-mode) .skills { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media (max-width: 767px) and (orientation: portrait) {
    #cards { grid-template-columns: 1fr; }
    .title-content .premise { margin-block: 13px; }
    .touch-mode #save-note { bottom: calc(var(--hud-bottom) + 132px); }
  }
  @media (max-width: 767px) {
    body:not(.touch-mode) .vitals { width: min(236px, 63vw); }
    body:not(.touch-mode) .skill { white-space: nowrap; gap: 4px; }
    body:not(.touch-mode) .skill kbd { min-width: 19px; padding-inline: 3px; }
  }
</style>
</head>
<body>
<div id="arena" aria-label="3D 战斗场景"></div>
<div id="screen-effects" aria-hidden="true"><div id="hurt"></div><div id="floaters"></div></div>

<main id="title-screen">
  <header class="title-top">
    <div class="brand"><i class="brand-sigil" aria-hidden="true"></i>ABYSS ECHO</div>
    <button class="text-button" id="title-options">操作与设置</button>
  </header>
  <section class="title-content" aria-labelledby="title">
    <h1 id="title">深渊回响</h1>
    <div class="subtitle" lang="en">ABYSS ECHO</div>
    <p class="premise">深入八座地牢，用祝福和遗物构筑法术，揭开回响之源。</p>
    <label class="spell-picker"><span>开局法印</span>
      <select id="arcana">
        <option value="thunder">雷鸣 · 雷涌跃击</option>
        <option value="ember">余烬 · 灼烧与焰环</option>
        <option value="frost">霜锋 · 减速与广域霜环</option>
      </select>
    </label>
    <button class="primary" id="start">进入深渊 <small aria-hidden="true">↗</small></button>
    <button class="text-button" id="continue-run" aria-label="继续深渊" hidden>继续深渊</button>
    <button class="text-button" id="altar-entry" aria-label="回响祭坛">回响祭坛</button>
    <p class="title-best" id="title-best" hidden></p>
    <p class="title-best" id="startup-error" role="alert" hidden></p>
  </section>
  <footer class="title-bottom">
    <div class="key-guide" aria-label="基础操作">
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动</span>
      <span><kbd>左键</kbd> 射击</span>
      <span><kbd>空格</kbd> 冲刺</span>
      <span><kbd>Q</kbd> 法印技</span>
    </div>
    <div class="touch-guide">拖动摇杆移动，自动瞄准射击</div>
    <div class="floor-guide" id="floor-guide">40 层地牢 · 33 种祝福 · 2.2.1</div>
  </footer>
</main>

<div id="hud" hidden>
  <div class="hud-corner stats">
    <div class="brand"><i class="brand-sigil" aria-hidden="true"></i>ABYSS ECHO</div>
    <div class="stat-list">
      <div class="stat"><span>击杀</span><strong id="kills">0</strong></div>
      <div class="stat"><span>用时</span><strong id="time">00:00</strong></div>
      <div class="stat"><span>总伤害</span><strong id="damage">0</strong></div>
    </div>
  </div>
  <aside class="hud-corner build" id="build" aria-label="已获祝福" hidden>
    <div class="build-title">已获祝福</div><div id="build-items"></div>
    <div id="route-pips" aria-label="回响路线进度"></div>
    <div id="relic-bar" aria-label="已获遗物" hidden></div>
  </aside>
  <header class="floor">
    <small id="floor-number">01 / 20</small>
    <h2 id="zone-name">腐朽地窖</h2>
    <div id="wave-text">第 1 波</div>
    <div id="modifier-list" aria-label="本层环境词条" hidden></div>
  </header>
  <div id="boss-hud" hidden>
    <div id="boss-name"></div>
    <div class="bar"><i class="trail" id="boss-trail"></i><i id="boss-fill"></i></div>
    <span id="boss-move"></span>
  </div>
  <aside class="hud-corner map-box" aria-label="小地图">
    <div class="map-label"><span>小地图</span><b aria-hidden="true">⌃</b></div>
    <canvas id="map" width="272" height="208" role="img" aria-label="玩家、障碍、敌人与传送门的实时位置"></canvas>
  </aside>
  <div class="hud-corner vitals">
    <div class="vital-row"><span id="level">等级 1</span><span id="health-text">100 / 100</span></div>
    <div class="bar" aria-hidden="true"><i class="trail" id="health-trail"></i><i id="health-fill"></i></div>
    <div class="skills">
      <button type="button" class="skill" id="dash-button"><kbd>空格</kbd>冲刺<em id="dash-text">就绪</em><i id="dash-fill"></i></button>
      <button type="button" class="skill" id="nova-button"><kbd>Q</kbd><span id="nova-name">雷涌</span><em id="nova-text">就绪</em><i id="nova-fill"></i></button>
      <button type="button" class="skill" id="guard-button" aria-label="守护技" disabled><kbd>E</kbd>守护<em id="guard-text">第 3 层</em><i id="guard-fill"></i></button>
      <button type="button" class="skill" id="barrage-button" aria-label="追猎技" disabled><kbd>V</kbd>追猎<em id="barrage-text">第 8 层</em><i id="barrage-fill"></i></button>
    </div>
  </div>
  <div class="hud-corner hud-actions">
    <button id="auto-fire" class="text-button" aria-pressed="false"><kbd>F</kbd> 自动射击</button>
    <button id="pause" class="text-button"><kbd>Esc</kbd> 暂停</button>
  </div>
  <div class="xp"><span id="xp-text">灵魂 0 / 10</span><div class="bar"><i id="xp-fill"></i></div></div>
  <div id="joystick" role="group" aria-label="移动摇杆"><div id="joystick-thumb" aria-hidden="true"></div></div>
  <div id="crosshair" aria-hidden="true" hidden></div>
  <div id="banner" aria-live="polite"><strong></strong><span></span></div>
  <div id="portal-note" hidden>踏入传送门，继续深入</div>
  <div id="save-note" role="status" aria-live="polite" hidden></div>
  <button class="text-button" id="trial-entry" hidden>挑战精英 · 额外祝福</button>
  <button class="text-button" id="vault-entry" aria-label="进入幽库" hidden>进入幽库 · 选择遗物</button>
</div>

<div class="overlay" id="overlay" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" id="sheet">
    <header class="sheet-head"><h2 id="sheet-title"></h2><p id="sheet-description"></p></header>
    <div id="sheet-content"></div>
    <footer class="sheet-actions" id="sheet-actions"></footer>
  </section>
</div>

<script src="three.min.js" onerror="document.getElementById('start').disabled=true; document.getElementById('startup-error').hidden=false; document.getElementById('startup-error').textContent='请将 three.min.js 和 index.html 放在同一目录。'"></script>

let audio, bus, noise;
const sounds = {
  shoot:  ['triangle', 360, 112, .078, .11, .018, .050],
  hostile:['triangle', 265,  94, .16,  .10, .038, .11],
  hit:    ['square',   170,  78, .060, .065,.024, .046],
  kill:   ['triangle', 122,  39, .17,  .21, .06,  .075],
  dash:   ['sawtooth', 220,  60, .14,  .085,.07,  .10],
  nova:   ['sine',     520,  36, .43,  .34, .11,  .18],
  hurt:   ['sawtooth', 117,  44, .22,  .18, .05,  .12],
  level:  ['sine',     440, 880, .29,  .15, 0,    .12],
  pickup: ['sine',     810,1260, .079, .05, 0,    .085],
  warn:   ['triangle', 164, 228, .15,  .1,  .02,  .24],
  boss:   ['triangle',  80,  36, .56,  .27, .08,  .32],
  portal: ['sine',     250, 715, .42,  .14, 0,    .16]

const lastSound = {};
function unlockAudio() {
  try {
    if (!audio) {
      const Audio = window.AudioContext || window.webkitAudioContext;
      if (!Audio) return;
      audio = new Audio();
      bus = audio.createGain();
      bus.gain.value = options.volume;
      const limiter = audio.createDynamicsCompressor();
      limiter.threshold.value = -17;
      limiter.ratio.value = 7;
      bus.connect(limiter).connect(audio.destination);
      noise = audio.createBuffer(1, Math.floor(audio.sampleRate * .6), audio.sampleRate);
      const data = noise.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = random(-1, 1);
    }
    if (audio.state === 'suspended') audio.resume().catch(() => {});
  } catch { /* 浏览器不支持音频时保持静音。 */ }
}
function sound(name, sourceX) {
  if (!audio || !bus || audio.state !== 'running' || options.volume === 0) return;
  const [wave, from, to, length, amp, grit, gap] = sounds[name];
  const now = audio.currentTime;
  if (now - (lastSound[name] ?? -1) < gap) return;
  lastSound[name] = now;
  const osc = audio.createOscillator(), gain = audio.createGain();
  let destination = bus;
  if (Number.isFinite(sourceX) && player && typeof audio.createStereoPanner === 'function') {
    const pan = audio.createStereoPanner();
    pan.pan.value = clamp((sourceX - player.root.position.x) / 12, -.82, .82);
    pan.connect(bus);
    destination = pan;
  }
  osc.type = wave;
  osc.frequency.setValueAtTime(from, now);
  osc.frequency.exponentialRampToValueAtTime(to, now + length);
  gain.gain.setValueAtTime(.0001, now);
  gain.gain.linearRampToValueAtTime(amp, now + .009);
  gain.gain.exponentialRampToValueAtTime(.0001, now + length);
  osc.connect(gain).connect(destination);
  osc.start(now); osc.stop(now + length);
  if (grit && noise) {
    const source = audio.createBufferSource(), filter = audio.createBiquadFilter(), envelope = audio.createGain();
    source.buffer = noise;
    filter.type = 'lowpass';
    filter.frequency.value = name === 'shoot' || name === 'hit' ? 2100 : 760;
    envelope.gain.setValueAtTime(grit, now);
    envelope.gain.exponentialRampToValueAtTime(.0001, now + length * .72);
    source.connect(filter).connect(envelope).connect(destination);
    source.start(now); source.stop(now + length * .75);
  }
}

    if (e.code in digits) { e.preventDefault(); takeBlessing(digits[e.code]); }
    if (e.code === 'KeyR') { e.preventDefault(); rerollBlessings(); }
    return;
  }
  if (mode !== 'play' || e.altKey || e.ctrlKey || e.metaKey) return;
  pressed.add(e.code);
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  if (e.repeat) return;
  if (['Space', 'ShiftLeft', 'ShiftRight'].includes(e.code)) queueSkill('dash');
  else if (e.code === 'KeyQ') queueSkill('nova');
  else if (e.code === 'KeyE') castExtraSkill('guard');
  else if (e.code === 'KeyV') castExtraSkill('barrage');
  else if (e.code === 'KeyF') toggleAuto();
}

// 主循环单独以真实时间推进镜头与顿帧，以战斗时间推进伤害和技能。
function updateGame(dt, elapsed = dt) {
  worldTime += dt;

    run.saveNoteT -= dt;
    if (run.saveNoteT <= 0) dom['save-note'].hidden = true;
  }
  updatePlayer(dt);
  for (const e of mobList) {
    updateEnemy(e, dt);
    if (mode !== 'play') return;
  }
  updateProjectiles(dt);
  if (mode !== 'play') return;
  updateHazards(dt);
  if (mode !== 'play') return;
  for (let i = mobList.length - 1; i >= 0; i--) if (mobList[i].dead) mobList.splice(i, 1);
  updateDrops(dt);
  updateModifiers(dt);
  if (mode !== 'play') return;
  updateFloor(dt);

function updateModifiers(dt) {
  if (!hasModifier('storm') || !['combat', 'trial'].includes(run.phase)) return;
  const storm = run.storm, p = player.root.position;
  storm.timer -= dt;
  if (storm.timer > 0) return;
  if (!storm.target) {
    const [x, z] = polar(random(0, TAU), random(8, 14));
    storm.target = { x: clamp(p.x + x, -20, 20), z: clamp(p.z + z, -15, 15) };
    storm.timer = 1.1;
    storm.fx = telegraph(storm.target.x, storm.target.z, 2.8, 0xe6adfb, storm.timer);
  } else {
    shock(storm.target.x, storm.target.z, 2.8, 0xf0bcff);
    if (distance(storm.target, p) < 2.8) hurtPlayer(16);
    storm.timer = 12.9;
    storm.target = null;

}
function setupTerrain() {

  function material(color, opacity) {

    t.water.rotation.x = -Math.PI / 2;
    t.platforms = [[-9,-3],[8,-4],[0,8]].slice(0,run.deepFloor.intensity).map(([x,z]) =>

      belt.rotation.x = -Math.PI / 2;

        arrow.rotation.x = x > 0 ? -Math.PI / 2 : Math.PI / 2;
        t.markers.push(arrow);

  }

function growVines(count) {
  const t = run.terrain, p = player.root.position;
  const beds = [[-13,-5,1], [13,5,1], [-6,11,0], [7,-11,0], [-15,9,1]];
  for (const [x, z, direction] of beds) {
    if (t.vines.length >= count) break;
    if (t.vines.some(v => v.x === x && v.z === z) || distance(p, {x,z}) < 4.5) continue;
    const candidates = [-1,0,1].map(i => ({ x: x + i * 1.45 * direction, z: z + i * 1.45 * (1 - direction), r: .84, center: i === 0 }));
    if (candidates.some(o => !clearOfZones(o.x, o.z, o.r))) continue;
    const obj = new THREE.Group();
    room.add(obj);
    const vine = { x,z,obj,hp:120 };
    t.vines.push(vine);
    for (const o of candidates) {
      obstacleList.push({ ...o, vine });
      mesh(obj, 'ball', t.stem, o.x, .49, o.z, .76, .54, .76);
      if (o.center) mesh(obj, 'gem', t.bud, o.x, 1.08, o.z, .38, .46, .38);
      else mesh(obj, 'cone', t.stem, o.x, 1.01, o.z, .29, .50, .29);

}
function removeVine(vine) {
  room.remove(vine.obj);
  const vines = run.terrain.vines;
  const index = vines.indexOf(vine);
  if (index >= 0) vines.splice(index,1);
  obstacleList = obstacleList.filter(o => o.vine !== vine);
}
function damageVine(vine, damage) {
  vine.hp -= damage;
  sparks(vine.x,.62,vine.z,0xffb8d6,6,3,.19,.26);
  if (vine.hp <= 0) { removeVine(vine); sound('kill'); }
}
function updateTerrain(dt) {

  const p = player.root.position, boss = run.boss, danger = boss?.enrage;
  t.age += dt;
  t.waveTime += dt;

  if (t.kind === 'vines') {
    if (!t.grown && (t.waveTime >= 8 || boss && t.waveTime >= 2)) {

    if (pulse && danger && t.vines.length < 2) growVines(2);
  } else if (t.kind === 'tide') {

    });
    if (pulse && t.tide && !safe) hurtPlayer(6);
  } else if (t.kind === 'factory') {
    for (const marker of t.markers) marker.visible = true;
    const reverse = (run.floor === 33 ? -1 : 1) * (danger ? -1 : 1);
    const speed = 3.2 * (hasModifier('gear') ? 2 : 1) * dt * reverse;
    for (const belt of t.belts) {
      const x = belt.position.x, push = speed * Math.sign(x);
      if (Math.abs(p.x - x) <= 2) place(p,0,push,.49);
      for (const e of mobList) if (!e.dead && Math.abs(e.root.position.x - x) <= 2) place(e.root.position,0,push,e.r);
    }
    if (t.age >= t.nextEvent) {

    }

    }

      beam.visible = i < number;

      const a = t.age * .35 * (danger ? -1 : 1) + i * Math.PI;
      beam.rotation.y = a;
      const forward = p.x * Math.sin(a) + p.z * Math.cos(a);
      const side = p.x * Math.cos(a) - p.z * Math.sin(a);
      if (forward > 1 && Math.abs(side) < 1.5) t.exposed = true;
    });
    if (pulse && t.exposed) hurtPlayer(5);
    if (run.floor !== 36 && t.age >= t.nextEvent) {
      t.nextEvent += 10;
      for (const shift of [-3,0,3]) addHazard(clamp(p.x + shift,-20,20),clamp(p.z + (shift ? 2 : 0),-15,15),2.2,.14,15,0xf6adf2,1);
    }
  }
  dom.arena.classList.toggle('curtain', t.curtain > 0);
}
function animateWorld(dt, visualTime, title) {
  for (const flame of flames) {
    const t = visualTime * 6.6 + flame.phase;
    flame.fire.scale.set(.27 + Math.sin(t * 1.44) * .071, .67 + Math.sin(t) * .19, .27 + Math.cos(t * 1.63) * .06);
    flame.fire.rotation.set(Math.cos(t * .8) * .15, t * .24, Math.sin(t) * .16);
    flame.core.scale.y = .39 + Math.cos(t * 1.62) * .115;
    flame.haze.scale.setScalar(3.14 + Math.sin(t * .89) * .31);
    if (flame.light) flame.light.intensity = 3.9 + Math.sin(t * 1.1) * .55 + Math.cos(t * 2.4) * .24;
    flame.ember -= dt;
    if (flame.ember < 0) {
      sparks(flame.x, flame.y + .2, flame.z, zone.fire, 3, .71, .23, .68);
      flame.ember = random(.10, .28);
    }
  }
  if (title && titleStage) {
    titleStage.userData.sigil.rotation.z = visualTime * .15;
    player.body.position.y = Math.sin(visualTime * 3) * .031;
    player.cape.rotation.x = -.24 + Math.sin(visualTime * 4) * .07;
    animateMage(visualTime, 0, 0, 0, true);
    if (Math.random() < dt * 15) sparks(random(3.5,10.5), random(.3,5.6), random(-6.5,-4.2), 0x64dfe6, 1, .67, .24, 1.2);
  }
  if (portal?.root.visible) {
    portal.swirl.rotation.y = visualTime * 1.75;
    portal.axis.position.y = 1.05 + Math.sin(visualTime * 4) * .17;
    portal.arch.rotation.y = visualTime * .76;
    if (Math.random() < dt * 23) sparks(portal.root.position.x, .36, portal.root.position.z, 0x76eddd, 3, 1.4, .21, .48);

}
function updateEffects(dt) {
  for (let i = effects.length - 1; i >= 0; i--) {
    const fx = effects[i];
    fx.t += dt;
    if (fx.t >= fx.duration) { removeEffect(fx); effects.splice(i, 1); }
    else fx.update(fx.t / fx.duration);

}
function updateCamera(dt) {
  const p = player.root.position, t = 1 - Math.exp(-dt * 7.9);
  view.x = lerp(view.x, p.x + aim.x * 1.9, t);
  view.z = lerp(view.z, p.z + aim.z * 1.9, t);
  const tremor = options.shake ? shake * shake * .51 : 0;
  const x = view.x + random(-tremor, tremor), z = view.z + random(-tremor, tremor);
  camera.position.set(x, 20, z + 12.5);
  camera.lookAt(view.x, 0, view.z);
  camera.updateMatrixWorld();
}
function titleCamera(t) {
  const drift = options.shake ? Math.sin(t * .35) * .26 : 0;
  if (camera.aspect < 1) {
    camera.position.set(4.1 + drift, 4.75, 17.1);
    camera.lookAt(4.1, -3.75, -2.4);
  } else {
    camera.position.set(3.2 + drift, 5.2, 13.4);

}
function showTitle() {
  clearModal();
  clearBattle();
  resetInput();
  input.auto = false;
  mode = 'title';
  hurt = hold = shake = 0;
  dom.hurt.style.opacity = 0;
  dom.hud.hidden = true;
  dom['portal-note'].hidden = true;
  dom['title-screen'].hidden = false;
  const { save, invalid } = readRunSave();
  dom['continue-run'].hidden = !save;
  dom['startup-error'].hidden = !invalid;

  textIf(dom['floor-guide'], `${MAX_FLOOR} 层地牢 · ${blessings.length} 种祝福 · 2.2.1`);
  for (const blade of player.blades ?? []) { scene.remove(blade); }
  player.blades = [];
  player.root.position.set(4.1, 0, 2.6);
  player.root.scale.setScalar(1.72);
  player.root.rotation.y = -.25;
  player.body.position.y = 0;
  player.body.rotation.set(0, 0, 0);

  player.legs.forEach(leg => leg.rotation.x = 0);
  player.weapon.position.z = .30;
  animateMage(rawTime, 0, 0, 0, true);

}
let renderScale = 1, frameSamples = 0, frameTotal = 0, qualityWait = 0, renderDirty = true;
const PIXEL_BUDGET = 2400000;
function pixelRatioFor(width, height, base) {
  return Math.min(base, Math.sqrt(PIXEL_BUDGET / Math.max(1, width * height))) * renderScale;
}
function resize() {
  camera.aspect = innerWidth / Math.max(1, innerHeight);
  const narrow = clamp((.86 - camera.aspect) / .44, 0, 1);
  camera.fov = dom.hud.hidden ? 44 : 44 + narrow * 26;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(pixelRatioFor(innerWidth, innerHeight, Math.min(touch.enabled ? 1.25 : 1.5, devicePixelRatio || 1)));
  renderer.setSize(innerWidth, innerHeight, false);

}
function tuneResolution(real) {

  if (qualityWait < 1.8) return;
  frameSamples++;
  frameTotal += Math.min(real, .12);
  if (frameSamples < 54) return;
  const average = frameTotal / frameSamples;

}
function frame(now) {

  const inTitle = mode === 'title' || (mode === 'options' && modalReturn === 'title');
  const slowed = hold > 0 ? dt * .08 : dt;
  hold = Math.max(0, hold - dt);

    updateGame(slowed, real);
    updateCamera(dt);
    updateEffects(slowed);
    updateNumbers(dt);
    uiTime += dt;
    if (uiTime >= .065) { updateHUD(uiTime); uiTime = 0; }
  } else if (inTitle) titleCamera(rawTime);
  if (active || inTitle) {
    animateWorld(dt, inTitle ? rawTime : worldTime, inTitle);
    drawDust(dt);
    renderBolts(bolts, boltMesh, false);
    renderBolts(hostile, hostileMesh, true);

function boot() {

function __selfTest() {
