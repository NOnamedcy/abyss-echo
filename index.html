function canvasTexture(w, h, paint) {
  const canvas = document.createElement('canvas');

function seeded(seed) {
  return () => {

function stoneTexture(theme, wall, seed) {

    ctx.fillStyle = theme.mortar;

    const rows = wall ? 5 : 7;
    const cw = w / columns, ch = h / rows;
    const base = new THREE.Color(wall ? theme.wall : theme.stone);
    for (let y = 0; y < rows; y++) {
      for (let x = -1; x < columns; x++) {
        const px = x * cw + (y % 2 ? cw * .5 : 0), py = y * ch;
        const shade = base.clone().multiplyScalar(.73 + rnd() * .55);

        gradient.addColorStop(.34, '#' + shade.getHexString());
        gradient.addColorStop(1, '#' + shade.clone().multiplyScalar(.65).getHexString());
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.moveTo(px + 3, py + 2 + rnd() * 3);
        ctx.lineTo(px + cw - 4, py + 2);
        ctx.lineTo(px + cw - 2, py + ch - 6);
        ctx.lineTo(px + cw - 7, py + ch - 2);
        ctx.lineTo(px + 2, py + ch - 3);
        ctx.closePath();
        ctx.fill();
        if (rnd() < .58) {

          ctx.moveTo(cx, cy);

function openBlessing(reason) {
  run.blessingReason = reason;
  run.choices = chooseOptions();
  if (!run.choices.length) return;
  mode = 'blessing';
  sound('level');
  renderBlessings();
}
function renderBlessings() {
  const levelUp = run.blessingReason === 'level';
  const description = run.blessingReason === 'trial' ? '权柄试炼完成 · 领取额外祝福' :
    levelUp ? `灵魂升华 · 当前等级 ${player.level}` : `第 ${run.floor} 层已肃清 · 领取清层祝福`;
  showModal('选择祝福', description, true);
  const cards = document.createElement('div');
  cards.id = 'cards';
  run.choices.forEach((b, i) => {
    const rarity = rarities[b.tier], count = bonus(b.id);
    const fusion = fusionName(run.element, blessingElements[b.id]);
    const hint = fusion ? ` ${arcana[run.element].nova}可触发${fusion}。` : '';
    const card = document.createElement('button');
    card.className = 'card';
    card.style.setProperty('--rarity', rarity.color);
    card.innerHTML = `<span class="card-top"><span>${rarity.name}</span><kbd>${i + 1}</kbd></span>
      <span class="card-rune" aria-hidden="true">${b.rune}</span><strong>${b.name}</strong>
      <span class="card-description">${b.description}${hint}</span><span class="owned">已拥有 ${count} / ${b.limit}</span>`;
    card.addEventListener('click', () => takeBlessing(i));
    cards.append(card);
  });
  dom['sheet-content'].append(cards);
  const reroll = modalAction(`重掷 · ${run.rerolls} 次${touch.enabled ? '' : '（R）'}`, rerollBlessings);
  reroll.disabled = run.rerolls <= 0;
  cards.firstElementChild.focus({ preventScroll: true });
}
function rerollBlessings() {
  if (mode !== 'blessing' || run.rerolls <= 0) return;
  run.rerolls--;
  run.choices = chooseOptions(run.choices.map(b => b.id));
  sound('pickup');
  renderBlessings();
}
function takeBlessing(index) {
  const choice = run.choices[index];
  if (mode !== 'blessing' || !choice) return;
  run.build.set(choice.id, bonus(choice.id) + 1);
  run.choices = [];
  rebuildStats();
  updateBuild();
  updateHUD(0);
  mode = 'play';
  clearModal();
  sound('pickup');
  if (run.pending.length) openBlessing(run.pending.shift());
}
function updateBuild() {
  dom.build.hidden = !run.build.size;
  dom['build-items'].replaceChildren();
  for (const b of blessings) {
    const count = bonus(b.id);
    if (!count) continue;
    const item = document.createElement('span');
    item.className = 'build-icon';
    item.style.setProperty('--rarity', rarities[b.tier].color);
    item.title = `${b.name} ×${count} · ${b.description}`;
    item.setAttribute('aria-label', item.title);
    item.innerHTML = `${b.rune}<b>${count}</b>`;
    dom['build-items'].append(item);
  }
}
function openPause() {
  if (mode !== 'play') return;
  mode = 'paused';
  showModal('游戏暂停', `第 ${run.floor} 层 · ${zone.name}`);
  modalAction('继续游戏', resumeGame, 'primary').focus();
  modalAction('操作与设置', () => openOptions('paused'));
  modalAction('返回标题', showTitle);
}
function resumeGame() {
  mode = 'play';
  clearModal();
  unlockAudio();
}
function openOptions(returnTo) {
  mode = 'options';
  modalReturn = returnTo;
  showModal('操作与设置', touch.enabled ? '触屏操作' : '键盘与鼠标');
  const controls = touch.enabled ? `
      <div><dt>移动</dt><dd>拖动左下摇杆</dd></div>
      <div><dt>射击</dt><dd>默认自动瞄准，也可按住战场瞄准射击</dd></div>
      <div><dt>冲刺与法印技</dt><dd>点按右下技能</dd></div>
      <div><dt>元素融合</dt><dd>先用祝福附上异元素，再释放法印技</dd></div>
      <div><dt>祝福与重掷</dt><dd>点按卡牌或重掷按钮</dd></div>` : `
      <div><dt>移动</dt><dd>W A S D / 方向键</dd></div>
      <div><dt>瞄准与连发</dt><dd>移动鼠标 / 按住左键</dd></div>
      <div><dt>冲刺与短暂无敌</dt><dd>空格 / Shift</dd></div>
      <div><dt>法印技清除周围弹幕</dt><dd>Q / 鼠标右键</dd></div>
      <div><dt>元素融合</dt><dd>先用祝福附上异元素，再释放法印技</dd></div>
      <div><dt>自动瞄准射击 / 暂停</dt><dd>F / Esc</dd></div>
      <div><dt>选择祝福 / 重掷</dt><dd>1 2 3 / R</dd></div>`;
  dom['sheet-content'].innerHTML = `
    <dl class="control-list">${controls}</dl>
    <label class="setting"><span>音效音量</span><input id="volume-setting" type="range" min="0" max="100" value="${Math.round(options.volume * 100)}"></label>
    <label class="setting"><span>镜头震动</span><input id="shake-setting" type="checkbox" ${options.shake ? 'checked' : ''}></label>
    <label class="setting"><span>伤害飘字</span><input id="numbers-setting" type="checkbox" ${options.numbers ? 'checked' : ''}></label>`;
  $('volume-setting').addEventListener('input', e => {
    options.volume = e.target.valueAsNumber / 100;
    unlockAudio();
    if (bus) bus.gain.value = options.volume;
    writeStore('abyss-echo.options', options);
  });
  $('volume-setting').addEventListener('change', () => sound('shoot'));
  for (const key of ['shake', 'numbers']) $(`${key}-setting`).addEventListener('change', e => {
    options[key] = e.target.checked;
    writeStore('abyss-echo.options', options);
  });
  modalAction('返回', closeOptions, 'primary').focus();
}
function closeOptions() {
  if (modalReturn === 'paused') {
    mode = 'play';
    openPause();
  } else {
    mode = 'title';
    clearModal();
  }
}
function showBest() {
  dom['title-best'].hidden = !best;
  if (best) textIf(dom['title-best'], best.win ?
    `最佳纪录　通关 · ${timeText(best.seconds)} · 击杀 ${best.kills}` :
    `最佳纪录　第 ${best.floor} 层 · 击杀 ${best.kills}`);
}
function endRun(win) {
  if (mode === 'result') return;
  mode = 'result';
  const score = { win, floor: run.floor, kills: run.kills, seconds: run.seconds, level: player.level };
  const scoreProgress = score.floor + Number(win);
  const bestProgress = best ? best.floor + Number(best.win) : 0;
  const record = !best || scoreProgress > bestProgress ||
    (scoreProgress === bestProgress && (win ? score.seconds < best.seconds : score.kills > best.kills));
  if (record) { best = score; writeStore('abyss-echo.best', best); }
  updateHUD(1);
  dom['portal-note'].hidden = true;
  showModal(win ? '深渊已平息' : '回响终止', record ? '本局创下新的最佳纪录' : win ? '四位守门首领已陨落' : zone.name);
  const stats = [['抵达层数', score.floor], ['击杀', score.kills], ['等级', score.level], ['用时', timeText(score.seconds)]];
  const build = blessings.filter(b => bonus(b.id)).map(b => `${b.name} ×${bonus(b.id)}`).join('、') || '本局尚未获得祝福';
  dom['sheet-content'].innerHTML = `<div class="score">${stats.map(([name,value]) => `<div><strong>${value}</strong><span>${name}</span></div>`).join('')}</div>
    <p class="result-build"><strong>祝福构筑</strong><br>${build}</p>`;
  modalAction('再来一局', newRun, 'primary').focus();
  modalAction('返回标题', showTitle);
  if (win) sound('level');
}
function resetInput() {
  pressed.clear();
  input.fire = false;
  input.dash = input.nova = 0;
  stopTouchMove();
  stopTouchAim();
}
function syncCursor() {
  const active = mode === 'play' && input.pointer && !dom.hud.hidden;
  dom.crosshair.hidden = !active;
  document.body.classList.toggle('aiming', active);
}
function trackPointer(e) {
  if (touch.aimId !== null ? e.pointerId !== touch.aimId : e.pointerType === 'touch') return;
  input.pointer = dom.arena.contains(e.target);
  if (input.pointer) {
    input.x = e.clientX;
    input.y = e.clientY;
    dom.crosshair.style.transform = `translate3d(${input.x}px,${input.y}px,0)`;
  }
  syncCursor();
}
function moveJoystick(e) {
  if (e.pointerId !== touch.moveId) return;
  const bounds = dom.joystick.getBoundingClientRect();
  const radius = bounds.width * .29;
  const x = e.clientX - bounds.left - bounds.width / 2;
  const z = e.clientY - bounds.top - bounds.height / 2;
  const length = Math.hypot(x, z);
  const amount = clamp((length / radius - .15) / .85, 0, 1);
  touch.x = length ? x / length * amount : 0;
  touch.z = length ? z / length * amount : 0;
  dom['joystick-thumb'].style.transform = `translate(${touch.x * radius}px, ${touch.z * radius}px)`;
}
function stopTouchMove() {
  if (touch.moveId === null) return;
  const id = touch.moveId;
  touch.moveId = null;
  touch.x = touch.z = 0;
  dom.joystick.classList.remove('active');
  dom['joystick-thumb'].style.transform = '';
  if (dom.joystick.hasPointerCapture(id)) dom.joystick.releasePointerCapture(id);
}
function stopTouchAim() {
  if (touch.aimId === null) return;
  const id = touch.aimId;
  touch.aimId = null;
  input.fire = input.pointer = false;
  if (dom.arena.hasPointerCapture(id)) dom.arena.releasePointerCapture(id);
  syncCursor();
}
function bindTouchInput() {
  document.body.classList.toggle('touch-mode', touch.enabled);
  addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch' || touch.enabled) return;
    touch.enabled = true;
    document.body.classList.add('touch-mode');
    resize();
  }, true);
  dom.joystick.addEventListener('pointerdown', e => {
    if (mode !== 'play' || touch.moveId !== null || e.button !== 0) return;
    e.preventDefault();
    touch.moveId = e.pointerId;
    dom.joystick.setPointerCapture(e.pointerId);
    dom.joystick.classList.add('active');
    moveJoystick(e);
  });
  dom.joystick.addEventListener('pointermove', moveJoystick);
  dom.arena.addEventListener('pointerdown', e => {
    if (mode !== 'play' || e.pointerType !== 'touch' || touch.aimId !== null) return;
    e.preventDefault();
    touch.aimId = e.pointerId;
    dom.arena.setPointerCapture(e.pointerId);
    trackPointer(e);
    input.fire = true;
    unlockAudio();
  });
  for (const event of ['pointerup', 'pointercancel', 'lostpointercapture']) {
    dom.joystick.addEventListener(event, e => { if (e.pointerId === touch.moveId) stopTouchMove(); });
    dom.arena.addEventListener(event, e => { if (e.pointerId === touch.aimId) stopTouchAim(); });
  }
  for (const skill of ['dash', 'nova']) {
    const button = dom[`${skill}-button`];
    const activate = () => { if (mode === 'play') queueSkill(skill); };
    button.addEventListener('pointerdown', e => { if (e.button === 0) activate(); });
    button.addEventListener('click', e => { if (e.detail === 0) activate(); });
  }
}
function bindInput() {
  bindTouchInput();
  dom.start.addEventListener('click', newRun);
  dom['title-options'].addEventListener('click', () => openOptions('title'));
  dom.pause.addEventListener('click', openPause);
  dom['trial-entry'].addEventListener('click', startTrial);
  dom['auto-fire'].addEventListener('click', toggleAuto);
  dom.arena.addEventListener('contextmenu', e => e.preventDefault());
  dom.arena.addEventListener('mousedown', e => {
    if (mode !== 'play' || touch.aimId !== null) return;
    trackPointer(e);
    unlockAudio();
    if (e.button === 0) input.fire = true;
    if (e.button === 2) queueSkill('nova');
  });
  addEventListener('pointermove', trackPointer);
  addEventListener('mouseup', e => { if (e.button === 0 && touch.aimId === null) input.fire = false; });
  addEventListener('pointercancel', e => { if (e.pointerType !== 'touch') resetInput(); });
  addEventListener('blur', () => { resetInput(); if (mode === 'play') openPause(); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { resetInput(); if (mode === 'play') openPause(); }
  });
  addEventListener('keydown', handleKey);
  addEventListener('keyup', e => pressed.delete(e.code));
}
function toggleAuto() {
  if (mode !== 'play') return;
  input.auto = !input.auto;
  dom['auto-fire'].setAttribute('aria-pressed', String(input.auto));
}
function handleKey(e) {
  if (e.code === 'Tab' && !dom.overlay.hidden) {
    const items = [...dom.sheet.querySelectorAll('button:not([disabled]), input')];
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last?.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first?.focus(); }
    return;
  }
  if (e.code === 'Escape' && !e.repeat) {
    if (mode === 'play') openPause();
    else if (mode === 'paused') resumeGame();
    else if (mode === 'options') closeOptions();
    return;
  }
  if (mode === 'blessing' && !e.repeat) {
    const digits = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 };
    if (e.code in digits) { e.preventDefault(); takeBlessing(digits[e.code]); }
    if (e.code === 'KeyR') { e.preventDefault(); rerollBlessings(); }
    return;
  }
  if (mode !== 'play' || e.altKey || e.ctrlKey || e.metaKey) return;
  pressed.add(e.code);
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  if (e.repeat) return;
  if (['Space', 'ShiftLeft', 'ShiftRight'].includes(e.code)) queueSkill('dash');
  else if (e.code === 'KeyQ') queueSkill('nova');
  else if (e.code === 'KeyF') toggleAuto();
}

// 主循环单独以真实时间推进镜头与顿帧，以战斗时间推进伤害和技能。
function updateGame(dt, elapsed = dt) {
  worldTime += dt;
  run.seconds += elapsed;
  updatePlayer(dt);
  for (const e of mobList) {
    updateEnemy(e, dt);
    if (mode !== 'play') return;
  }
  updateProjectiles(dt);
  if (mode !== 'play') return;
  for (let i = mobList.length - 1; i >= 0; i--) if (mobList[i].dead) mobList.splice(i, 1);
  updateDrops(dt);
  updateFloor(dt);
  if (run.pending.length && mode === 'play') openBlessing(run.pending.shift());
}
function animateWorld(dt, visualTime, title) {
  for (const flame of flames) {
    const t = visualTime * 6.6 + flame.phase;
    flame.fire.scale.set(.27 + Math.sin(t * 1.44) * .071, .67 + Math.sin(t) * .19, .27 + Math.cos(t * 1.63) * .06);
    flame.fire.rotation.set(Math.cos(t * .8) * .15, t * .24, Math.sin(t) * .16);
    flame.core.scale.y = .39 + Math.cos(t * 1.62) * .115;
    flame.haze.scale.setScalar(3.14 + Math.sin(t * .89) * .31);
    if (flame.light) flame.light.intensity = 3.9 + Math.sin(t * 1.1) * .55 + Math.cos(t * 2.4) * .24;
    flame.ember -= dt;
    if (flame.ember < 0) {
      sparks(flame.x, flame.y + .2, flame.z, zone.fire, 3, .71, .23, .68);
      flame.ember = random(.10, .28);
    }
  }
  if (title && titleStage) {
    titleStage.userData.sigil.rotation.z = visualTime * .15;
    player.body.position.y = Math.sin(visualTime * 3) * .031;
    player.cape.rotation.x = -.24 + Math.sin(visualTime * 4) * .07;
    if (Math.random() < dt * 15) sparks(random(3.5,10.5), random(.3,5.6), random(-6.5,-4.2), 0x64dfe6, 1, .67, .24, 1.2);
  }
  if (portal?.root.visible) {
    portal.swirl.rotation.y = visualTime * 1.75;
    portal.axis.position.y = 1.05 + Math.sin(visualTime * 4) * .17;
    portal.arch.rotation.y = visualTime * .76;
    if (Math.random() < dt * 23) sparks(portal.root.position.x, .36, portal.root.position.z, 0x76eddd, 3, 1.4, .21, .48);
  }
}
function updateEffects(dt) {
  for (let i = effects.length - 1; i >= 0; i--) {
    const fx = effects[i];
    fx.t += dt;
    if (fx.t >= fx.duration) { removeEffect(fx); effects.splice(i, 1); }
    else fx.update(fx.t / fx.duration);
  }
}
function updateCamera(dt) {
  const p = player.root.position, t = 1 - Math.exp(-dt * 7.9);
  view.x = lerp(view.x, p.x + aim.x * 1.9, t);
  view.z = lerp(view.z, p.z + aim.z * 1.9, t);
  const tremor = options.shake ? shake * shake * .51 : 0;
  const x = view.x + random(-tremor, tremor), z = view.z + random(-tremor, tremor);
  camera.position.set(x, 20, z + 12.5);
  camera.lookAt(view.x, 0, view.z);
  camera.updateMatrixWorld();
}
function titleCamera(t) {
  const drift = options.shake ? Math.sin(t * .35) * .26 : 0;
  camera.position.set(3.2 + drift, 5.2, 13.4);
  camera.lookAt(camera.aspect < 1 ? 4.1 : -.35, 2.25, -2.4);
  camera.updateMatrixWorld();
}
function showTitle() {
  clearModal();
  clearBattle();
  resetInput();
  input.auto = false;
  mode = 'title';
  hurt = hold = shake = 0;
  dom.hurt.style.opacity = 0;
  dom.hud.hidden = true;
  dom['portal-note'].hidden = true;
  dom['title-screen'].hidden = false;
  for (const blade of player.blades ?? []) { scene.remove(blade); }
  player.blades = [];
  player.root.position.set(4.1, 0, 2.6);
  player.root.scale.setScalar(1.58);
  player.root.rotation.y = -.58;
  player.body.position.y = 0;
  player.body.rotation.set(0, 0, 0);
  player.body.visible = true;
  player.legs.forEach(leg => leg.rotation.x = 0);
  player.weapon.position.z = .30;
  playerLight.position.set(4.1, 3.1, 3.4);
  buildRoom(0, 1, true);
  resize();
  titleCamera(rawTime);
  syncCursor();
  showBest();
}
let renderScale = 1, frameSamples = 0, frameTotal = 0, qualityWait = 0, renderDirty = true;
function resize() {
  camera.aspect = innerWidth / Math.max(1, innerHeight);
  const narrow = clamp((.86 - camera.aspect) / .44, 0, 1);
  camera.fov = dom.hud.hidden ? 44 : 44 + narrow * 26;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(touch.enabled ? 1.25 : 1.5, devicePixelRatio || 1) * renderScale);
  renderer.setSize(innerWidth, innerHeight, false);
  dustPoints.material.uniforms.pixels.value = renderer.domElement.height * .71;
  renderDirty = true;
}
function tuneResolution(real) {
  if (mode !== 'play' || document.hidden) return;
  qualityWait += real;
  if (qualityWait < 1.8) return;
  frameSamples++;
  frameTotal += Math.min(real, .12);
  if (frameSamples < 54) return;
  const average = frameTotal / frameSamples;
  frameSamples = 0; frameTotal = 0; qualityWait = 0;
  if (average > .0198 && renderScale > .67) {
    renderScale = Math.max(.67, renderScale - .13);
    resize();
  }
}
function frame(now) {
  const real = lastFrame ? (now - lastFrame) / 1000 : .016;
  const dt = Math.min(.033, real);
  lastFrame = now;
  rawTime += dt;
  tuneResolution(real);
  const active = mode === 'play';
  const inTitle = mode === 'title' || (mode === 'options' && modalReturn === 'title');
  const slowed = hold > 0 ? dt * .08 : dt;
  hold = Math.max(0, hold - dt);
  shake = Math.max(0, shake - dt * 2.25);
  hurt = Math.max(0, hurt - dt * 2.25);
  dom.hurt.style.opacity = hurt;
  if (active) {
    updateGame(slowed, real);
    updateCamera(dt);
    updateEffects(slowed);
    updateNumbers(dt);
    uiTime += dt;
    if (uiTime >= .065) { updateHUD(uiTime); uiTime = 0; }
  } else if (inTitle) titleCamera(rawTime);
  if (active || inTitle) {
    animateWorld(dt, inTitle ? rawTime : worldTime, inTitle);
    drawDust(dt);
    renderBolts(bolts, boltMesh, false);
    renderBolts(hostile, hostileMesh, true);
  }
  if (active || inTitle || renderDirty) {
    renderer.render(scene, camera);
    renderDirty = false;
  }
  requestAnimationFrame(frame);
}
function boot() {
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = .92;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.physicallyCorrectLights = false;
    dom.arena.append(renderer.domElement);
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x160f12);
    scene.fog = new THREE.FogExp2(0x160f12, .027);
    camera = new THREE.PerspectiveCamera(44, 1, .1, 100);
    hemi = new THREE.HemisphereLight(0xe8cac6, 0x362933, .26);
    moon = new THREE.DirectionalLight(0xc5b5bc, .43);
    moon.position.set(-7, 11, 5);
    playerLight = new THREE.PointLight(0x62cfeb, 3.6, 8, 1.4);
    scene.add(hemi, moon, playerLight);
    for (let i = 0; i < 4; i++) {
      const light = new THREE.PointLight(0xff934b, 3.9, 13.5, 1.35);
      torchLights.push(light);
      scene.add(light);
    }
    setupArt();
    setupPools();
    player = makePlayer();
    bindInput();
    addEventListener('resize', resize);
    showTitle();
    requestAnimationFrame(frame);
  } catch (error) {
    dom.start.disabled = true;
    dom['startup-error'].hidden = false;
    dom['startup-error'].textContent = '无法初始化 3D 场景。请使用支持 WebGL 的桌面浏览器打开。';
    console.error(error);
  }
}
boot();
</script>
