<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>深渊回响 · ABYSS ECHO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#05030a;font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;color:#e9e4f5;user-select:none}
canvas{display:block}
#game{position:fixed;inset:0;cursor:crosshair}
.hidden{display:none!important}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.75) 100%)}
#flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(255,0,40,0) 40%,rgba(255,20,60,.55) 100%);opacity:0;transition:opacity .35s}
#lowhp{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 160px rgba(255,0,40,.0);transition:box-shadow .3s}
#dmgLayer{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.dn{position:absolute;left:0;top:0;font-weight:900;font-size:18px;color:#fff;text-shadow:0 2px 0 #000,0 0 8px rgba(0,0,0,.8);white-space:nowrap;will-change:transform,opacity}
.dn.crit{color:#ffd56b;font-size:26px;text-shadow:0 2px 0 #4a2a00,0 0 14px rgba(255,180,40,.9)}
.dn.dot{color:#ff9a4a;font-size:14px}
.dn.hurt{color:#ff4d6d;font-size:24px}
.dn.heal{color:#6dffa8;font-size:16px}
.dn.lv{color:#7cf6ff;font-size:24px;letter-spacing:2px}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#topbar{position:absolute;top:18px;left:50%;transform:translateX(-50%);text-align:center}
#roomInfo{font-size:20px;font-weight:800;letter-spacing:4px;color:#f4e6c4;text-shadow:0 0 12px rgba(255,190,90,.35)}
#waveInfo{margin-top:4px;font-size:13px;color:#a99cc6;letter-spacing:2px}
#stats{position:absolute;top:20px;left:22px;font-size:13px;color:#a99cc6;line-height:1.9}
#stats b{color:#fff;font-size:15px}
#minimap{position:absolute;top:16px;right:16px;width:150px;height:150px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(10,6,20,.55);backdrop-filter:blur(4px)}
#bossbar{position:absolute;top:78px;left:50%;transform:translateX(-50%);width:min(640px,70vw);text-align:center}
#bossName{font-size:16px;font-weight:900;letter-spacing:6px;color:#ff8aa6;text-shadow:0 0 14px rgba(255,40,90,.6);margin-bottom:6px}
.track{position:relative;height:12px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);border-radius:3px;overflow:hidden}
.track .ghost,.track .fill{position:absolute;left:0;top:0;bottom:0}
#bossGhost{background:#fff3;width:100%}
#bossFill{background:linear-gradient(90deg,#8a0b2c,#ff2f6a,#ff8aa6);width:100%;box-shadow:0 0 12px #ff2f6a}
#panel{position:absolute;left:24px;bottom:34px;display:flex;align-items:flex-end;gap:14px}
#lv{width:58px;height:58px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#2a3b6a,#0b0f22);border:2px solid #7cf6ff;box-shadow:0 0 18px rgba(124,246,255,.35);font-weight:900;font-size:22px}
#lv small{font-size:9px;letter-spacing:1px;color:#7cf6ff;margin-top:-2px}
.hpwrap{width:300px}
.hpwrap .label{font-size:12px;color:#a99cc6;margin-bottom:4px;display:flex;justify-content:space-between}
.hpwrap .label b{color:#fff}
#hpTrack{height:16px}
#hpGhost{background:#ffffff40;width:100%}
#hpFill{background:linear-gradient(90deg,#9b1030,#ff3d5e,#ff8a8a);width:100%;box-shadow:0 0 10px rgba(255,60,90,.6)}
.skills{display:flex;gap:10px;margin-left:6px}
.skill{position:relative;width:58px;height:58px;border-radius:12px;background:rgba(12,10,26,.8);border:1px solid rgba(124,246,255,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.skill span{font-size:14px;font-weight:800;z-index:1}
.skill i{font-style:normal;font-size:9px;color:#8fb6c9;z-index:1;margin-top:2px}
.skill .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.7)}
.skill.ready{box-shadow:0 0 14px rgba(124,246,255,.45)}
#xpbar{position:absolute;left:0;right:0;bottom:0;height:8px;background:rgba(0,0,0,.6)}
#xpFill{height:100%;width:0;background:linear-gradient(90deg,#2b7cff,#7cf6ff);box-shadow:0 0 12px #7cf6ff;transition:width .15s}
#builds{position:absolute;left:22px;top:90px;display:flex;flex-direction:column;gap:6px;max-height:60vh;flex-wrap:wrap}
.bd{display:flex;align-items:center;gap:6px;font-size:12px;color:#cfc5e8}
.hex{width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);color:#0b0816}
.r-C .hex,.hex.r-C{background:linear-gradient(135deg,#e7e2f0,#9d97ad)}
.r-R .hex,.hex.r-R{background:linear-gradient(135deg,#8fd0ff,#2d73ff)}
.r-E .hex,.hex.r-E{background:linear-gradient(135deg,#e1a6ff,#8a2be2)}
.r-L .hex,.hex.r-L{background:linear-gradient(135deg,#fff0a8,#ff9d00)}
.bd em{font-style:normal;color:#7cf6ff;font-weight:800}
#hint{position:absolute;bottom:22px;right:22px;font-size:12px;color:#7d7396;text-align:right;line-height:1.7}

/* banner */
#banner{position:fixed;top:30%;left:0;right:0;text-align:center;pointer-events:none;opacity:0}
#banner .t1{font-size:56px;font-weight:900;letter-spacing:14px;background:linear-gradient(180deg,#fff7df,#e8b45a 60%,#9a5a10);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px rgba(255,170,60,.45))}
#banner .t2{font-size:16px;letter-spacing:8px;color:#cdbfe8;margin-top:6px}
#banner.show{animation:ban 2.6s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.25);letter-spacing:30px}12%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}

/* screens */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(10,5,25,.55),rgba(3,2,8,.92))}
#menu{background:radial-gradient(ellipse at center,rgba(10,5,25,.1),rgba(3,2,8,.85))}
.title{font-size:96px;font-weight:900;letter-spacing:24px;padding-left:24px;background:linear-gradient(180deg,#fffaf0 0%,#f3c46a 45%,#8a3c0c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(255,150,40,.35))}
.sub{font-size:16px;letter-spacing:12px;color:#9f93c4;margin:4px 0 40px}
.btn{pointer-events:auto;cursor:pointer;padding:14px 56px;font-size:18px;font-weight:800;letter-spacing:8px;color:#1a0f02;background:linear-gradient(180deg,#ffe3a0,#e39b2c);border:none;border-radius:4px;box-shadow:0 0 30px rgba(255,170,50,.35),inset 0 -3px 0 rgba(0,0,0,.25);transition:transform .12s,box-shadow .12s;margin:6px}
.btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 50px rgba(255,170,50,.6)}
.btn.ghost{background:transparent;color:#d9cdf5;border:1px solid #6b5f8e;box-shadow:none}
.controls{display:grid;grid-template-columns:auto auto;gap:6px 22px;margin-top:36px;font-size:13px;color:#a99cc6}
.controls b{color:#ffe3a0;font-weight:700;text-align:right}
.best{margin-top:22px;font-size:13px;color:#7d7396;letter-spacing:2px}

#upgrade h2{font-size:30px;letter-spacing:10px;color:#ffe3a0;text-shadow:0 0 18px rgba(255,170,60,.4);margin-bottom:34px}
.cards{display:flex;gap:26px}
.card{pointer-events:auto;cursor:pointer;width:240px;height:330px;border-radius:14px;padding:24px 20px;position:relative;background:linear-gradient(180deg,#191330,#0c0919);border:1px solid #3c335a;display:flex;flex-direction:column;align-items:center;text-align:center;transition:transform .15s,box-shadow .15s;animation:cardIn .45s cubic-bezier(.2,1.4,.4,1) backwards}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) rotateX(30deg)}}
.card:hover{transform:translateY(-10px)}
.card.r-C{border-color:#8f89a3}.card.r-C:hover{box-shadow:0 0 30px rgba(220,215,235,.25)}
.card.r-R{border-color:#3d8bff;box-shadow:0 0 16px rgba(61,139,255,.2)}.card.r-R:hover{box-shadow:0 0 40px rgba(61,139,255,.55)}
.card.r-E{border-color:#a64dff;box-shadow:0 0 20px rgba(166,77,255,.3)}.card.r-E:hover{box-shadow:0 0 50px rgba(166,77,255,.65)}
.card.r-L{border-color:#ffb02e;box-shadow:0 0 26px rgba(255,176,46,.35);background:linear-gradient(180deg,#2a1c08,#0f0a04)}.card.r-L:hover{box-shadow:0 0 60px rgba(255,176,46,.75)}
.card .rar{font-size:11px;letter-spacing:4px;margin-bottom:22px;color:#a99cc6}
.card.r-R .rar{color:#7fb6ff}.card.r-E .rar{color:#d19bff}.card.r-L .rar{color:#ffcf6e}
.card .hex{width:84px;height:84px;font-size:36px}
.card .nm{font-size:22px;font-weight:900;margin:22px 0 12px;letter-spacing:3px}
.card .ds{font-size:14px;color:#c7bde0;line-height:1.7}
.card .own{position:absolute;bottom:16px;font-size:11px;color:#7d7396}
.card .key{position:absolute;top:12px;left:14px;font-size:12px;color:#6b5f8e;font-weight:800}
.uhint{margin-top:30px;font-size:13px;color:#8d82ad;letter-spacing:2px}
.uhint b{color:#ffe3a0}

#over h1{font-size:72px;letter-spacing:18px;font-weight:900}
#over.lose h1{color:#ff4d6d;text-shadow:0 0 30px rgba(255,40,90,.5)}
#over.win h1{background:linear-gradient(180deg,#fffaf0,#f3c46a,#8a3c0c);-webkit-background-clip:text;background-clip:text;color:transparent}
.ostats{display:grid;grid-template-columns:repeat(4,130px);gap:14px;margin:30px 0 20px}
.ostat{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:14px;text-align:center}
.ostat div{font-size:12px;color:#8d82ad;letter-spacing:2px}
.ostat b{display:block;font-size:26px;margin-top:6px;color:#fff}
#overBuilds{display:flex;flex-wrap:wrap;gap:8px;max-width:640px;justify-content:center;margin-bottom:26px}
#pause h2{font-size:44px;letter-spacing:16px;margin-bottom:30px;color:#ffe3a0}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="vignette"></div>
<div id="lowhp"></div>
<div id="flash"></div>
<div id="dmgLayer"></div>

<div id="hud" class="hidden">
  <div id="topbar"><div id="roomInfo">第 1 层</div><div id="waveInfo"></div></div>
  <div id="stats">击杀 <b id="kills">0</b><br>用时 <b id="time">0:00</b><br>伤害 <b id="dealt">0</b></div>
  <canvas id="minimap" width="300" height="300"></canvas>
  <div id="bossbar" class="hidden"><div id="bossName"></div><div class="track"><div class="ghost" id="bossGhost"></div><div class="fill" id="bossFill"></div></div></div>
  <div id="builds"></div>
  <div id="panel">
    <div id="lv"><span id="lvNum">1</span><small>LEVEL</small></div>
    <div class="hpwrap">
      <div class="label"><span>生命</span><b id="hpText">100 / 100</b></div>
      <div class="track" id="hpTrack"><div class="ghost" id="hpGhost"></div><div class="fill" id="hpFill"></div></div>
    </div>
    <div class="skills">
      <div class="skill" id="skDash"><span>冲刺</span><i>SPACE</i><div class="cd"></div></div>
      <div class="skill" id="skNova"><span>新星</span><i>右键 / Q</i><div class="cd"></div></div>
    </div>
  </div>
  <div id="hint">左键 射击 · F 自动射击 <b id="afState">关</b><br>ESC 暂停</div>
  <div id="xpbar"><div id="xpFill"></div></div>
</div>

<div id="banner"><div class="t1"></div><div class="t2"></div></div>

<div id="menu" class="screen">
  <div class="title">深渊回响</div>
  <div class="sub">ABYSS ECHO · 3D 动作肉鸽</div>
  <button class="btn" id="btnStart">开始潜入</button>
  <div class="controls">
    <b>WASD</b><span>移动</span>
    <b>鼠标</b><span>瞄准 · 左键射击</span>
    <b>SPACE / SHIFT</b><span>冲刺（无敌帧）</span>
    <b>右键 / Q</b><span>灵魂新星（范围爆发）</span>
    <b>F</b><span>切换自动射击</span>
    <b>1 2 3 / R</b><span>选择祝福 / 重掷</span>
  </div>
  <div class="best" id="bestRec"></div>
</div>

<div id="upgrade" class="screen hidden">
  <h2 id="upTitle">选择一项祝福</h2>
  <div class="cards" id="cards"></div>
  <div class="uhint">按 <b>1 / 2 / 3</b> 选择 · <b>R</b> 重掷（剩余 <b id="rerolls">3</b> 次）</div>
</div>

<div id="pause" class="screen hidden">
  <h2>暂停</h2>
  <button class="btn" id="btnResume">继续</button>
  <button class="btn ghost" id="btnQuit">放弃本局</button>
</div>

<div id="over" class="screen hidden">
  <h1 id="overTitle">你陨落了</h1>
  <div class="ostats">
    <div class="ostat"><div>抵达层数</div><b id="oRoom">1</b></div>
    <div class="ostat"><div>击杀</div><b id="oKills">0</b></div>
    <div class="ostat"><div>等级</div><b id="oLv">1</b></div>
    <div class="ostat"><div>用时</div><b id="oTime">0:00</b></div>
  </div>
  <div id="overBuilds"></div>
  <div><button class="btn" id="btnRetry">再次潜入</button><button class="btn ghost" id="btnMenu">返回标题</button></div>
</div>

<script src="three.min.js"></script>
<script>
'use strict';
// ============================================================
//  深渊回响 · ABYSS ECHO
// ============================================================
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const easeOutBack = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function lerpAngle(a, b, t) { let d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI; return a + d * t; }
const fmtTime = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

// ============================================================
//  AUDIO (procedural)
// ============================================================
const Sfx = (() => {
  let ctx = null, master = null, nbuf = null; const last = {};
  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.32; master.connect(ctx.destination);
      nbuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      drone();
    } catch (e) { ctx = null; }
  }
  function gate(k, min) { const t = performance.now(); if (last[k] && t - last[k] < min) return false; last[k] = t; return true; }
  function tone(f, dur, type = 'square', vol = .2, slide = 1, delay = 0) {
    if (!ctx) return; const t = ctx.currentTime + delay;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide !== 1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
  }
  function noise(dur, vol = .3, freq = 900, type = 'lowpass') {
    if (!ctx) return; const t = ctx.currentTime;
    const s = ctx.createBufferSource(); s.buffer = nbuf;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * .5, dur + .05);
  }
  function drone() {
    const g = ctx.createGain(); g.gain.value = 0.05;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 380;
    [55, 55.6, 82.4].forEach(fr => { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fr; o.connect(f); o.start(); });
    const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = .07; lg.gain.value = 160; lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    f.connect(g); g.connect(master);
  }
  return {
    init,
    shoot() { if (gate('s', 55)) tone(rand(820, 900), .06, 'square', .035, .45); },
    hit() { if (gate('h', 35)) { tone(rand(180, 240), .05, 'sawtooth', .06, .6); noise(.04, .08, 2500); } },
    kill() { if (gate('k', 40)) { noise(.18, .2, 1400); tone(150, .18, 'triangle', .16, .35); } },
    dash() { noise(.18, .16, 3500, 'bandpass'); tone(300, .15, 'sine', .08, 2.2); },
    hurt() { tone(120, .3, 'sawtooth', .22, .5); noise(.2, .2, 600); },
    pick() { if (gate('p', 30)) tone(rand(1100, 1500), .07, 'sine', .05, 1.4); },
    level() { [523, 659, 784, 1046].forEach((f, i) => tone(f, .25, 'triangle', .12, 1, i * .07)); },
    boom() { noise(.6, .38, 420); tone(70, .5, 'sine', .4, .35); },
    nova() { noise(.5, .25, 1800, 'bandpass'); tone(220, .5, 'sawtooth', .12, 4); tone(110, .6, 'sine', .25, .5); },
    zap() { if (gate('z', 60)) { noise(.12, .14, 5000, 'highpass'); tone(1800, .1, 'square', .04, .3); } },
    portal() { [196, 247, 294, 392].forEach((f, i) => tone(f, .9, 'sine', .07, 1, i * .1)); },
    charge() { tone(90, .35, 'sawtooth', .12, 2.2); },
    ebullet() { if (gate('eb', 90)) tone(rand(420, 520), .08, 'triangle', .04, .7); },
    die() { noise(1.2, .4, 300); tone(200, 1.4, 'sawtooth', .25, .2); },
    win() { [392, 494, 587, 784, 988].forEach((f, i) => tone(f, .6, 'triangle', .14, 1, i * .12)); },
  };
})();

// ============================================================
//  RENDERER / SCENE
// ============================================================
const canvas = $('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.outputEncoding = THREE.sRGBEncoding;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0612, 0.027);
scene.background = new THREE.Color(0x05030a);
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 20, 12.5);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

const hemi = new THREE.HemisphereLight(0x8a90ff, 0x1a0c14, 0.26); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xc8c8ff, 1.15);
sun.position.set(14, 32, 12); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -27, right: 27, top: 27, bottom: -27, near: 1, far: 90 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;
scene.add(sun); scene.add(sun.target);

// fixed light count (avoid shader recompiles)
const playerLight = new THREE.PointLight(0x5ce8ff, 3.6, 12, 2); scene.add(playerLight);
const portalLight = new THREE.PointLight(0xb070ff, 0, 14, 2); scene.add(portalLight);
const bossLight = new THREE.PointLight(0xff2266, 0, 16, 2); scene.add(bossLight);
const flashLight = new THREE.PointLight(0xffffff, 0, 16, 2); scene.add(flashLight);
const torches = []; for (let i = 0; i < 4; i++) { const l = new THREE.PointLight(0xff7a30, 2.2, 15, 2); scene.add(l); torches.push(l); }

// ============================================================
//  SHARED ASSETS
// ============================================================
function makeGlowTex() {
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.18, 'rgba(255,255,255,.85)');
  gr.addColorStop(.45, 'rgba(255,255,255,.22)'); gr.addColorStop(1, 'rgba(255,255,255,0)');

const fx = (() => {
  const N = 1000, pool = []; let idx = 0;
  for (let i = 0; i < N; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    s.visible = false; scene.add(s);
    pool.push({ s, life: 0, max: 1, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, size: 1, drag: 2, grav: 0 });
  }
  function emit(x, y, z, color, o = {}) {
    const p = pool[idx]; idx = (idx + 1) % N;
    p.x = x; p.y = y; p.z = z; p.vx = o.vx || 0; p.vy = o.vy || 0; p.vz = o.vz || 0;
    p.life = p.max = o.life || .5; p.size = o.size || .5; p.drag = o.drag ?? 3; p.grav = o.grav || 0;
    p.s.material.color.setHex(color); p.s.visible = true; p.s.position.set(x, y, z);
  }
  function burst(x, y, z, color, n, speed, size, life) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, u = rand(-.3, 1), sp = speed * rand(.3, 1);
      emit(x, y, z, color, { vx: Math.cos(a) * sp, vy: u * sp * .8, vz: Math.sin(a) * sp, size: size * rand(.5, 1.2), life: life * rand(.6, 1.2), grav: -6 });
    }
  }
  function update(dt) {
    for (let i = 0; i < N; i++) {
      const p = pool[i]; if (p.life <= 0) continue;
      p.life -= dt; if (p.life <= 0) { p.s.visible = false; continue; }
      const d = Math.max(0, 1 - p.drag * dt);
      p.vx *= d; p.vz *= d; p.vy = p.vy * d + p.grav * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      if (p.y < .05) { p.y = .05; p.vy *= -.3; }
      const k = p.life / p.max;
      p.s.position.set(p.x, p.y, p.z);
      const sc = p.size * (0.3 + 0.7 * k); p.s.scale.set(sc, sc, 1);
      p.s.material.opacity = Math.min(1, k * 1.6);
    }
  }
  return { emit, burst, update };
})();

function buildObstacles(isBoss) {
  clearGroup(obsGroup); obstacles = [];
  const wallMat = new THREE.MeshStandardMaterial({ color: biome.wall, roughness: .85, metalness: .1 });
  const spots = [];
  if (isBoss) [[-9, -7], [9, -7], [-9, 7], [9, 7]].forEach(([x, z]) => spots.push({ x, z, r: 1.3 }));
  else {
    const n = randi(4, 8); let tries = 0;
    while (spots.length < n && tries++ < 200) {
      const x = rand(-ARENA + 3, ARENA - 3), z = rand(-ARENA + 3, ARENA - 3), r = rand(.8, 1.4);
      if (Math.hypot(x, z) < 6.5) continue;
      if (Math.hypot(x - PORTAL_POS.x, z - PORTAL_POS.z) < 4.5) continue;
      if (Math.hypot(x, z - (ARENA - 5)) < 4) continue;
      if (spots.some(s => Math.hypot(s.x - x, s.z - z) < s.r + r + 3.5)) continue;
      spots.push({ x, z, r });
    }
  }
  spots.forEach(s => {
    const g = new THREE.Group(); g.position.set(s.x, 0, s.z);
    if (Math.random() < .65 || isBoss) {
      const h = rand(3, 5.5);
      const col = new THREE.Mesh(new THREE.CylinderGeometry(s.r * .82, s.r, h, 12), wallMat);
      col.position.y = h / 2; g.add(col);
      const base = new THREE.Mesh(GEO.box, wallMat); base.scale.set(s.r * 2.4, .5, s.r * 2.4); base.position.y = .25; g.add(base);
      const band = new THREE.Mesh(new THREE.TorusGeometry(s.r * .88, .05, 6, 24), accentMat(biome.accent, 2));
      band.rotation.x = Math.PI / 2; band.position.y = h * .55; g.add(band);
    } else {
      const cm = new THREE.MeshStandardMaterial({ color: biome.accent, emissive: biome.accent, emissiveIntensity: .9, roughness: .15, metalness: .2, transparent: true, opacity: .88 });
      for (let i = 0; i < 4; i++) {
        const c = new THREE.Mesh(new THREE.ConeGeometry(rand(.3, .5), rand(1.6, 3), 5), cm);
        c.position.set(rand(-.4, .4), .8, rand(-.4, .4)); c.rotation.set(rand(-.4, .4), rand(0, 3), rand(-.4, .4)); g.add(c);
      }

    }
    g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

function collideCircle(o) {
  for (const s of obstacles) {
    const dx = o.x - s.x, dz = o.z - s.z, d = Math.hypot(dx, dz), m = s.r + o.r;
    if (d < m && d > 0.0001) { o.x = s.x + dx / d * m; o.z = s.z + dz / d * m; }
  }
  const lim = ARENA - o.r;
  o.x = clamp(o.x, -lim, lim); o.z = clamp(o.z, -lim, lim);
}

    for (const e of enemies) {
      if (e.dead || e.spawnT > 0 || e.hop > 2) continue;
      if (Math.hypot(e.x - x, e.z - z) < e.r + .6 && (e.orbHit || 0) < gameTime) {
        e.orbHit = gameTime + .35; damageEnemy(e, S.dmg * .85, { kbx: e.x - P.x, kbz: e.z - P.z, kbMul: .6 });
        fx.burst(x, 1, z, 0x9ff9ff, 5, 5, .5, .25);
      }
    }
  }
}

// ============================================================
//  PLAYER
// ============================================================
function tryDash() {
  if (P.dashCd > 0 || state !== 'play') return;
  let [x, z] = moveInput(); if (!x && !z) { x = P.ax; z = P.az; }
  P.dashX = x; P.dashZ = z; P.dashT = .17; P.dashCd = S.dashCd; P.dashHit.clear();
  Sfx.dash(); shockwave(P.x, P.z, 1.6, 0x7cf6ff, .25);
}
function tryNova() { if (P.novaCd > 0 || state !== 'play') return; nova(false); P.novaCd = S.novaCd; }
function nova(mega) {
  const r = S.novaR * (mega ? 1.8 : 1), dmg = S.dmg * S.novaMul * (mega ? 3 : 1);
  shockwave(P.x, P.z, r, 0x66e0ff, .45); shockwave(P.x, P.z, r * .65, 0xffffff, .3);
  for (let k = 0; k < 70; k++) { const a = k / 70 * TAU, sp = r * rand(2.4, 3.4); fx.emit(P.x, 1, P.z, k % 3 ? 0x66e0ff : 0xffffff, { vx: Math.cos(a) * sp, vz: Math.sin(a) * sp, vy: rand(0, 2), size: rand(.6, 1.1), life: .45, drag: 4 }); }
  flashAt(P.x, P.z, 0x66e0ff, 7); shake = Math.min(1, shake + .35); hitStop = Math.max(hitStop, .05); Sfx.nova();
  for (const e of enemies) if (!e.dead && Math.hypot(e.x - P.x, e.z - P.z) < r + e.r) damageEnemy(e, dmg, { kbx: e.x - P.x, kbz: e.z - P.z, kbMul: 2.6 });
  for (let i = bullets.length - 1; i >= 0; i--) { const b = bullets[i]; if (!b.friendly && Math.hypot(b.x - P.x, b.z - P.z) < r) { fx.burst(b.x, 1, b.z, b.color, 3, 3, .4, .2); killBullet(i); } }
}
function damagePlayer(dmg) {
  if (P.inv > 0 || P.dashT > 0 || state !== 'play') return;
  dmg *= (1 - S.armor); P.hp -= dmg; P.inv = .7;
  shake = Math.min(1, shake + .45); hitStop = Math.max(hitStop, .07); flashScreen(); Sfx.hurt();
  dmgNum(P.x, 2.4, P.z, '-' + Math.round(dmg), 'hurt'); fx.burst(P.x, 1, P.z, 0xff3355, 18, 6, .6, .5);
  if (P.hp <= 0) {
    if (S.revive > 0) { S.revive--; P.hp = S.maxHp * .5; P.inv = 2.2; nova(true); showBanner('不 死 鸟', '浴火重生'); }
    else die();
  }
}
function updatePlayer(dt) {
  const [mx, mz] = moveInput();
  // aim
  ndc.set(mouseX / innerWidth * 2 - 1, -(mouseY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  if (ray.ray.intersectPlane(aimPlane, aimPt)) { const ax = aimPt.x - P.x, az = aimPt.z - P.z, l = Math.hypot(ax, az); if (l > .3) { P.ax = ax / l; P.az = az / l; } }
  if (P.dashT > 0) {
    P.dashT -= dt; P.vx = P.dashX * 34; P.vz = P.dashZ * 34;
    for (let k = 0; k < 3; k++) fx.emit(P.x + rand(-.3, .3), rand(.4, 1.6), P.z + rand(-.3, .3), 0x5ce8ff, { size: .9, life: .3, drag: 6 });
    if (S.dashDmg > 0) for (const e of enemies) if (!e.dead && !P.dashHit.has(e) && Math.hypot(e.x - P.x, e.z - P.z) < e.r + 1.3) { P.dashHit.add(e); damageEnemy(e, S.dmg * S.dashDmg, { kbx: P.dashX, kbz: P.dashZ }); }
  } else {
    const k = Math.min(1, dt * 14); P.vx += (mx * S.speed - P.vx) * k; P.vz += (mz * S.speed - P.vz) * k;
  }
  P.x += P.vx * dt; P.z += P.vz * dt; collideCircle(P);
  P.dashCd = Math.max(0, P.dashCd - dt); P.novaCd = Math.max(0, P.novaCd - dt); P.inv -= dt;
  P.fireT -= dt;
  if ((mouseDown || autoFire) && P.fireT <= 0 && P.dashT <= 0) { P.fireT = 1 / S.fireRate; fire(); }
  if (S.regen > 0) heal(S.regen * dt);
  // model
  P.face = lerpAngle(P.face, Math.atan2(P.ax, P.az), Math.min(1, dt * 18));
  P.recoil = Math.max(0, P.recoil - dt);
  const moving = Math.hypot(P.vx, P.vz) / S.speed;
  player.position.set(P.x - P.ax * P.recoil * .8, Math.abs(Math.sin(gameTime * 11)) * .08 * moving, P.z - P.az * P.recoil * .8);
  player.rotation.y = P.face;
  const lx = P.vx * Math.cos(P.face) - P.vz * Math.sin(P.face), lz = P.vx * Math.sin(P.face) + P.vz * Math.cos(P.face);
  player.rotation.x = clamp(lz * .012, -.15, .15); player.rotation.z = clamp(-lx * .012, -.15, .15);
  pCape.rotation.x = -.15 - moving * .25 + Math.sin(gameTime * 8) * .04;
  pOrb.position.y = 1.15 + Math.sin(gameTime * 4) * .08; pOrbCore.rotation.x += dt * 3; pOrbCore.rotation.y += dt * 4;
  player.visible = !(P.inv > 0 && Math.sin(gameTime * 50) > .3);
  playerLight.position.set(P.x, 2.2, P.z); playerLight.intensity = lerp(playerLight.intensity, 3.6, Math.min(1, dt * 10));
  pRing.material.opacity = .25 + (P.dashCd <= 0 ? .2 : 0);
}

// ============================================================
//  ROOM FLOW
// ============================================================
function clearField() {
  enemies.forEach(removeEnemyMesh); enemies.length = 0;
  while (bullets.length) killBullet(bullets.length - 1);
  souls.forEach(s => { s.sp.visible = false; soulPool.push(s); }); souls.length = 0;
  telegraphs.forEach(disposeTele); telegraphs.length = 0; deferred.length = 0;
  pendingSpawns = 0; bossRef = null; $('bossbar').classList.add('hidden');
}
function startRoom(n) {
  room = n; const bi = Math.floor((n - 1) / 5) % BIOMES.length;
  if (bi !== currentBiome) applyBiome(bi);
  clearField(); const isBoss = n % 5 === 0; buildObstacles(isBoss);
  P.x = 0; P.z = ARENA - 5; P.vx = P.vz = 0; P.inv = 1;
  portal.visible = false; portalLight.intensity = 0;
  wave = 0; wavesTotal = isBoss ? 1 : Math.min(5, 2 + Math.floor(n / 4)); roomState = 'fight'; waveDelay = 1.6;
  camTarget.set(P.x, 0, P.z - 4);
  showBanner(isBoss ? '首领之间' : `第 ${n} 层`, biome.name + (isBoss ? ' · ' + BOSS_NAMES[bi] : ''));
  Sfx.portal(); fx.burst(P.x, 1, P.z, biome.accent, 50, 8, 1, .9); shockwave(P.x, P.z, 5, biome.accent, .6);
}
function spawnWave() {
  if (room % 5 === 0) {
    pendingSpawns++; Sfx.charge(); shake = .6;
    telegraph(0, -5, 4, BOSS_COLORS[(Math.ceil(room / 5) - 1) % 4], 2, () => { pendingSpawns--; createEnemy('boss', 0, -5); shake = 1; Sfx.boom(); flashAt(0, -5, 0xffffff, 8); });
    return;
  }
  const n = room, count = Math.min(30, Math.round(5 + n * 1.4 + wave * 2));
  for (let i = 0; i < count; i++) {
    const r = Math.random(); let t = 'grunt';
    if (n >= 2 && r < .24) t = 'archer'; else if (n >= 3 && r < .4) t = 'charger'; else if (n >= 4 && r < .54) t = 'bomber';
    let x, z, tries = 0;
    do { x = rand(-ARENA + 2, ARENA - 2); z = rand(-ARENA + 2, ARENA - 2); tries++; }
    while (tries < 40 && (Math.hypot(x - P.x, z - P.z) < 8 || obstacles.some(s => Math.hypot(s.x - x, s.z - z) < s.r + 1.2)));
    pendingSpawns++;
    const col = ETYPES[t].color;
    telegraph(x, z, 1.1, col, .9 + i * .045, () => { pendingSpawns--; createEnemy(t, x, z); fx.burst(x, .5, z, col, 10, 5, .6, .4); });
  }
}
function roomClear() {
  roomState = 'portal'; upgradeQueue.push('room'); heal(S.maxHp * .15);
  if (room >= 20) return;
  portal.visible = true; portal.scale.setScalar(.01); portalLight.intensity = 4;
  showBanner('净 化 完 成', '穿过传送门，继续深入'); Sfx.portal();
}
function updateRoom(dt) {
  if (roomState === 'fight') {
    if (enemies.length === 0 && pendingSpawns === 0) {
      waveDelay -= dt;
      if (waveDelay <= 0) { if (wave < wavesTotal) { spawnWave(); wave++; waveDelay = 1; } else roomClear(); }
    }
  } else if (roomState === 'portal' && portal.visible) {
    portal.scale.setScalar(Math.min(1, portal.scale.x + dt * 2));
    if (Math.hypot(P.x - PORTAL_POS.x, P.z - PORTAL_POS.z) < 1.8) startRoom(room + 1);
  }
}
function updateTelegraphs(dt) {
  for (let i = telegraphs.length - 1; i >= 0; i--) {
    const t = telegraphs[i]; t.t += dt; const k = Math.min(1, t.t / t.dur);
    t.fill.scale.setScalar(Math.max(.01, t.r * k)); t.ring.material.opacity = .5 + .4 * Math.sin(t.t * 20);
    if (k >= 1) { disposeTele(t); telegraphs.splice(i, 1); if (t.cb) t.cb(); }
  }
}

// ============================================================
//  RUN LIFECYCLE
// ============================================================
let runStart = 0;
function newRun() {
  Sfx.init();
  S = baseStats(); P = newPlayer(); owned = {}; upgradeQueue = []; rerolls = 3; gameTime = 0; autoFire = false; $('afState').textContent = '关';
  rebuildOrbitals(); renderBuilds(); player.visible = true;
  ['menu', 'over', 'pause', 'upgrade'].forEach(id => $(id).classList.add('hidden'));
  $('hud').classList.remove('hidden');
  state = 'play'; currentBiome = -1; startRoom(1);
}
function die() {
  state = 'dying'; player.visible = false; Sfx.die();
  fx.burst(P.x, 1, P.z, 0x7cf6ff, 120, 14, 1.2, 1.4); fx.burst(P.x, 1, P.z, 0xff3355, 60, 10, 1, 1.2);
  shockwave(P.x, P.z, 10, 0x7cf6ff, 1); flashAt(P.x, P.z, 0x7cf6ff, 10); shake = 1; hitStop = .6;
  setTimeout(() => endRun(false), 1600);
}
function endRun(win) {
  state = win ? 'won' : 'dead'; if (win) Sfx.win();
  const best = JSON.parse(localStorage.getItem('abyss_best') || '{"room":0,"kills":0}');
  if (room > best.room || (room === best.room && P.kills > best.kills)) localStorage.setItem('abyss_best', JSON.stringify({ room, kills: P.kills, win }));
  $('over').className = 'screen ' + (win ? 'win' : 'lose');
  $('overTitle').textContent = win ? '深渊已被净化' : '你陨落了';
  $('oRoom').textContent = room + ' / 20'; $('oKills').textContent = P.kills; $('oLv').textContent = P.level; $('oTime').textContent = fmtTime(gameTime);
  $('overBuilds').innerHTML = renderBuilds() || '<span style="color:#7d7396">未获得任何祝福</span>';
  $('hud').classList.add('hidden');
}
function toMenu() {
  clearField(); orbitals.forEach(o => scene.remove(o.g)); orbitals = []; portal.visible = false; portalLight.intensity = 0;
  ['over', 'pause', 'upgrade', 'hud'].forEach(id => $(id).classList.add('hidden'));
  $('menu').classList.remove('hidden'); state = 'menu'; player.visible = true; P = newPlayer(); P.x = 0; P.z = 0; updateBest();
}
function togglePause() {
  if (state === 'play') { state = 'paused'; $('pause').classList.remove('hidden'); }
  else if (state === 'paused') { state = 'play'; $('pause').classList.add('hidden'); }
}
function updateBest() {
  const b = JSON.parse(localStorage.getItem('abyss_best') || 'null');
  $('bestRec').textContent = b ? `最佳纪录：抵达第 ${b.room} 层 · 击杀 ${b.kills}${b.win ? ' · 已通关' : ''}` : '深渊在等待第一位挑战者';
}
$('btnStart').onclick = newRun; $('btnRetry').onclick = newRun; $('btnMenu').onclick = toMenu;
$('btnResume').onclick = togglePause; $('btnQuit').onclick = () => { $('pause').classList.add('hidden'); endRun(false); };

// ============================================================
//  HUD
// ============================================================
const mm = $('minimap').getContext('2d');
function updateHUD(dt) {
  P.ghost = P.ghost > P.hp ? Math.max(P.hp, P.ghost - S.maxHp * dt * .6) : P.hp;
  $('hpFill').style.width = clamp(P.hp / S.maxHp, 0, 1) * 100 + '%';
  $('hpGhost').style.width = clamp(P.ghost / S.maxHp, 0, 1) * 100 + '%';
  $('hpText').textContent = `${Math.max(0, Math.ceil(P.hp))} / ${Math.round(S.maxHp)}`;
  $('xpFill').style.width = (P.xp / P.xpNext * 100) + '%';
  $('lvNum').textContent = P.level;
  $('kills').textContent = P.kills; $('time').textContent = fmtTime(gameTime); $('dealt').textContent = Math.round(P.dealt).toLocaleString();
  $('roomInfo').textContent = room % 5 === 0 ? `首领之间 · ${room} / 20` : `第 ${room} 层 / 20`;
  $('waveInfo').textContent = roomState === 'portal' ? `${biome.name} · 已净化` : room % 5 === 0 ? biome.name : `${biome.name} · 波次 ${Math.max(1, wave)} / ${wavesTotal} · 剩余 ${enemies.length + pendingSpawns}`;
  const dsk = $('skDash'), nsk = $('skNova');
  dsk.querySelector('.cd').style.height = (P.dashCd / S.dashCd * 100) + '%'; dsk.classList.toggle('ready', P.dashCd <= 0);
  nsk.querySelector('.cd').style.height = (P.novaCd / S.novaCd * 100) + '%'; nsk.classList.toggle('ready', P.novaCd <= 0);
  $('lowhp').style.boxShadow = `inset 0 0 160px rgba(255,0,40,${P.hp / S.maxHp < .3 ? .45 + .2 * Math.sin(gameTime * 6) : 0})`;
  if (bossRef) {
    bossRef.ghost = bossRef.ghost > bossRef.hp ? Math.max(bossRef.hp, bossRef.ghost - bossRef.maxHp * dt * .25) : bossRef.hp;
    $('bossFill').style.width = Math.max(0, bossRef.hp / bossRef.maxHp) * 100 + '%';
    $('bossGhost').style.width = Math.max(0, bossRef.ghost / bossRef.maxHp) * 100 + '%';
  }
  // minimap
  const W = 300, sc = W / (ARENA * 2 + 2), tx = v => (v + ARENA + 1) * sc;
  mm.clearRect(0, 0, W, W);
  mm.strokeStyle = 'rgba(255,255,255,.18)'; mm.lineWidth = 2; mm.strokeRect(sc, sc, ARENA * 2 * sc, ARENA * 2 * sc);
  mm.fillStyle = 'rgba(255,255,255,.18)'; obstacles.forEach(s => { mm.beginPath(); mm.arc(tx(s.x), tx(s.z), s.r * sc, 0, TAU); mm.fill(); });
  if (portal.visible) { mm.fillStyle = '#c070ff'; mm.beginPath(); mm.arc(tx(PORTAL_POS.x), tx(PORTAL_POS.z), 9, 0, TAU); mm.fill(); }
  enemies.forEach(e => { mm.fillStyle = e.type === 'boss' ? '#ff2f6a' : e.elite ? '#ffc23a' : '#ff5470'; mm.beginPath(); mm.arc(tx(e.x), tx(e.z), e.type === 'boss' ? 12 : 5, 0, TAU); mm.fill(); });
  mm.fillStyle = '#7cf6ff'; mm.beginPath(); mm.arc(tx(P.x), tx(P.z), 7, 0, TAU); mm.fill();
}

// ============================================================
//  VISUALS (always)
// ============================================================
const camTarget = new THREE.Vector3(0, 0, 0);
function updateVisuals(dt, rdt) {
  fx.update(dt);
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const s = shockwaves[i]; s.t += dt; const k = s.t / s.dur;
    if (k >= 1) { scene.remove(s.m); s.m.material.dispose(); shockwaves.splice(i, 1); continue; }
    s.m.scale.setScalar(.1 + s.r * (1 - Math.pow(1 - k, 3))); s.m.material.opacity = .9 * (1 - k);
  }
  for (let i = bolts.length - 1; i >= 0; i--) { const b = bolts[i]; b.t -= dt; b.l.material.opacity = b.t / .16; if (b.t <= 0) { scene.remove(b.l); b.l.geometry.dispose(); b.l.material.dispose(); bolts.splice(i, 1); } }
  flashLight.intensity = Math.max(0, flashLight.intensity - rdt * 22);
  const T = performance.now() / 1000;
  braziers.forEach((b, i) => {
    const f = .8 + Math.sin(T * 9 + b.seed) * .12 + Math.sin(T * 23 + b.seed * 2) * .08;
    torches[i].intensity = 2.2 * f; b.glow.scale.setScalar(2.6 * f);
    if (Math.random() < .5) fx.emit(b.x + rand(-.25, .25), 1.6, b.z + rand(-.25, .25), biome.torch, { vy: rand(2, 3.5), vx: rand(-.3, .3), vz: rand(-.3, .3), size: rand(.6, 1), life: rand(.4, .7), drag: 1 });
  });
  if (runeCircle) runeCircle.rotation.y += rdt * .05;
  if (embers) { const p = embers.geometry.attributes.position.array; for (let i = 1; i < p.length; i += 3) { p[i] += rdt * .6; if (p[i] > 12) p[i] = 0; } embers.geometry.attributes.position.needsUpdate = true; }
  if (portal.visible) {
    portalRing.rotation.z += rdt * 1.5; portalCore.material.opacity = .7 + Math.sin(T * 5) * .2; portalLight.position.set(PORTAL_POS.x, 2, PORTAL_POS.z);
    const a = Math.random() * TAU; fx.emit(PORTAL_POS.x + Math.cos(a) * 1.6, 2 + Math.sin(a) * 1.6, PORTAL_POS.z, biome.accent, { vx: -Math.cos(a) * 2, vy: -Math.sin(a) * 2, size: .6, life: .6, drag: 0 });
  }
  if (bossRef && !bossRef.dead) { bossLight.color.setHex(bossRef.color); bossLight.position.set(bossRef.x, 3 + bossRef.hop, bossRef.z); bossLight.intensity = 3.5; } else bossLight.intensity = Math.max(0, bossLight.intensity - rdt * 4);
  if (flashTimer > 0) { flashTimer -= rdt; if (flashTimer <= 0) { $('flash').style.transition = 'opacity .45s'; $('flash').style.opacity = 0; } }
  updateDmgNums(rdt);

  // camera
  if (state === 'menu') {
    const a = T * .08; camera.position.set(Math.sin(a) * 30, 17, Math.cos(a) * 30); camera.lookAt(0, 0, 0);
    player.position.set(0, 0, 0); player.rotation.set(0, T * .4, 0); pOrb.position.y = 1.15 + Math.sin(T * 4) * .08;
    playerLight.position.set(0, 2.2, 0);
  } else {
    const look = Math.min(1, 3.2);
    const des = new THREE.Vector3(P.x + P.ax * look, 0, P.z + P.az * look * .8);
    camTarget.lerp(des, 1 - Math.exp(-rdt * 6));
    shake = Math.max(0, shake - rdt * 1.7); const s2 = shake * shake;
    const ox = (Math.random() * 2 - 1) * s2 * .9, oz = (Math.random() * 2 - 1) * s2 * .9;
    camera.position.set(camTarget.x + ox, 20 + (Math.random() * 2 - 1) * s2 * .5, camTarget.z + 12.5 + oz);
    camera.lookAt(camTarget.x + ox * .4, 0.9, camTarget.z + oz * .4);
  }
}

// ============================================================
//  MAIN LOOP
// ============================================================
function update(dt) {
  gameTime += dt;
  while (deferred.length) deferred.shift()();
  updatePlayer(dt); updateOrbitals(dt); updateEnemies(dt); updateBullets(dt); updateSouls(dt); updateTelegraphs(dt); updateRoom(dt);
  if (state === 'play' && upgradeQueue.length) openUpgrade();
}
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const rdt = Math.min(.05, (now - last) / 1000); last = now;
  let dt = rdt; if (hitStop > 0) { hitStop -= rdt; dt *= .08; }
  if (cardLock > 0) cardLock -= rdt;
  if (state === 'play') { update(dt); updateHUD(rdt); }
  else if (state === 'dying') { gameTime += dt; updateEnemies(dt * .3); updateBullets(dt * .3); }
  if (state !== 'paused' && state !== 'upgrade') updateVisuals(state === 'dying' ? dt * .5 : dt, rdt);
  renderer.render(scene, camera);
}
// boot: menu backdrop
applyBiome(0); buildObstacles(false); updateBest(); P.x = 0; P.z = 0;
requestAnimationFrame(loop);
</script>
